# Claim-governance policy (vendor/claim_governance; format: finite-math-kernels
# docs/audit/policy-format.md). The head is hand-written; everything between the
# generated-claims markers is written by
#   PYTHONPATH=vendor python -m proof_records.generate_ledgers research/ledger.json --claims claim_governance.toml

[repository]
name = "larsbx/novelty-lab"

[scan]
prose = ["README.md", "docs/**/*.md", "paper/**/*.tex", "paper/**/*.md"]
source = ["kernel/**/*.py", "experiments/**/*.py", "scripts/*.py", "tools/*.py"]
exclude = ["vendor/**"]

# Ledger classes (research/ledger.json) plus the programme ladder of docs/calibration.md.
[status]
classes = ["candidate", "literature-cleared", "artifact", "novel", "open", "experimental", "finite-domain", "imported", "conditional", "proved", "retired"]

[status.synonyms]
"candidate" = "candidate"
"literature-cleared candidate" = "literature-cleared"
"artifact contribution" = "artifact"
"novel result" = "novel"
"pending" = "open"
"experimental result" = "experimental"
"verified finite computation" = "finite-domain"
"imported" = "imported"
"conditional" = "conditional"
"proved result" = "proved"
"retired" = "retired"

[claims]
paths = ["docs/**/*.md"]
statement_kinds = ["Theorem", "Proposition", "Lemma", "Corollary", "Conjecture"]
window_lines = 6
file_status_marker = "**Status:**"
file_status_lines = 5

[promotion]
proving_phrases = ["is proved", "we prove", "has been proved", "is a theorem", "is novel", "establishes"]
negating_context = ["not ", "no ", "never", "until", "only after", "await", "pending", "would", "without", "if "]
settled_classes = ["proved", "finite-domain", "artifact", "novel"]
radius = 120

[coverage]
tests = ["tests/test_*.py"]
claim_pattern = 'GUARDS_CLAIM = "(?P<claim>[^"]*)"'
contract_pattern = 'GUARDS_CONTRACT = "(?P<contract>[^"]*)"'
require_classes = ["finite-domain", "proved"]

# Kernel arithmetic is exact: no floats, no transcendental primitives.
[[numerics.rule]]
name = "exact-kernel"
pattern = '\bfloat\b|\bmath\.(?:sqrt|log|exp|sin|cos)\b|\d\.\d'
paths = ["kernel/**/*.py"]
message = "inexact arithmetic in the certificate kernel; use int or Fraction"

# Programme candidates: one status, three surfaces (README table, dossier, registry).
[[claim]]
name = "N1"
status = "candidate"
[[claim.surfaces]]
path = "README.md"
anchor = "| N1 |"
window_lines = 0
[[claim.surfaces]]
path = "docs/candidates/N1.md"
anchor = "**Status:**"
window_lines = 0
[[claim.surfaces]]
path = "research/candidates.json"
anchor = '"id": "N1"'
window_lines = 2

