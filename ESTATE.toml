version = 2
template = "estate-repository-v2"

# SPEC_estate v0.1 §3 fields, then this template's layout sections. Adopted from
# larsbx/langlands-lab; the audit is the one pinned below, run by the policy job of
# .github/workflows/verify.yml and never vendored here.

[repo]
id = "novelty-lab"
slug = "larsbx/novelty-lab"
class = "research"
layer = 3
band = "EXPLORE"
stage = "candidate"           # written by estate CI only (no estate CI ledger exists yet)
inv = []                      # INV families: registration pending
default_branch = "main"

[origin]
decided_by = "stated"
decision = "DR-0001"          # larsbx/estate-governance docs/decisions
chats = []
artifacts = []

[[dep]]
id = "estate-governance"
rev = "5ea47dec8086eab6a1dad6fd239688d20ea89891"
pin = "sha256:412a64dea58d709aae21e5a0315b8e7e96488c310a9d999267927ba3d8146a30"

# Pin = SHA-256 of the vendored.toml rows from this repository with recorded and actual
# file hashes (the audit's vendored digest). Re-pin whenever vendored.toml changes.
[[dep]]
id = "finite-math-kernels"
rev = "734f60a04a6cf8a68fab74367acc6b33d0e02cd9"
pin = "sha256:e088aa6f067a30030aad3e238d7e32dca789c6bc566fcc3553bdafb8c7fac622"

[exports]
names = []

[layout]
status = "transitional"       # see [migration]: census drivers that back finite-domain claims live in experiments/

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

[[plane]]
id = "policy"
target = "ESTATE.toml"
authority = "governance"
required = true
current = ["ESTATE.toml", "claim_governance.toml", "AGENTS.md", "CONTRIBUTING.md"]

[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

[[plane]]
id = "proof"
target = "research"
authority = "claim_state"
required = true
current = ["research", "tla"]

[[plane]]
id = "oracle"
target = "NoveltyLab"
authority = "non_authoritative_oracle"
required = true
current = ["NoveltyLab", "Main.lean", "ExportF3.lean", "lakefile.toml", "lake-manifest.json", "lean-toolchain"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["experiments"]

[[plane]]
id = "data"
target = "data"
authority = "evidence"
required = true
current = ["data"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[[plane]]
id = "contract"
target = "schemas"
authority = "contract"
required = true
current = ["schemas"]

[[plane]]
id = "vendor"
target = "vendor"
authority = "pinned_external"
required = true
current = ["vendor", "vendored.toml"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools", "scripts"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ARCHITECTURE.md"]

[[plane]]
id = "publication"
target = "paper"
authority = "publication"
required = true
current = ["paper"]

[[language]]
name = "Python"
authority = "canonical"
roles = ["kernel", "census", "tooling"]
acceptance_authority = true

[[language]]
name = "Lean"
authority = "supporting"
roles = ["oracle"]
acceptance_authority = false

[[language]]
name = "TLA+"
authority = "supporting"
roles = ["proof_dependency_model"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = [
  "experiments/n2: census drivers whose committed output backs a finite-domain ledger record (rank_law, word_defects) move to kernel/n2; experiments/ keeps exploratory and bounded-experiment drivers only",
  "scripts/ -> tools/: one repository-tooling target",
  "tla/ -> research/tla/: generated claim-state surfaces under the proof target",
]
