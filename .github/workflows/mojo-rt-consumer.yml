name: Pinned Mojo/MAX RT consumer

on:
  pull_request:
    paths:
      - "vendor/mojo/**"
      - "experiments/rt/**"
      - "tests/fixtures/hyperbolic_rt_v1.txt"
      - "tests/test_mojo_rt_estate.py"
      - "vendored.toml"
      - "ESTATE.toml"
      - ".github/workflows/mojo-rt-consumer.yml"
  push:
    branches: [main]
    paths:
      - "vendor/mojo/**"
      - "experiments/rt/**"
      - "tests/fixtures/hyperbolic_rt_v1.txt"
      - "tests/test_mojo_rt_estate.py"
      - "vendored.toml"
      - "ESTATE.toml"
      - ".github/workflows/mojo-rt-consumer.yml"

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          run-install: false
      - name: Check immutable estate vendoring and dependency pin
        run: |
          python vendor/vendoring/check_vendored_sync.py
          python tools/estate_pins.py
      - name: Replay the same 48 vectors through independent Python
        run: python -m unittest discover -s tests -p test_mojo_rt_estate.py -v
      - name: Compile and execute vendored RT in Mojo with MAX
        run: pixi run --manifest-path experiments/rt/pixi.toml conformance
