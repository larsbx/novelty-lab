name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  calibrated-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_f3_table.py
      - run: python scripts/check_registry.py
      - run: python vendor/vendoring/check_vendored_sync.py
      - run: python -m proof_records.generate_ledgers research/ledger.json --claims claim_governance.toml --check
        env: {PYTHONPATH: vendor}
      - run: python -m claim_governance.cli
        env: {PYTHONPATH: vendor}
      - run: python -m unittest discover -s tests -v
      - run: python experiments/n2/rank_law.py --check
      - run: python experiments/n2/word_defects.py --check
      - run: python experiments/n2/h3_pilot.py --check
      - run: python experiments/n2/defect_jordan.py --check
      - run: python experiments/n2/word_g2.py --check
      - run: python experiments/n2/h3_integral.py --check
