name: lean-oracle
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/verify_all.sh lean
      - run: python -m unittest discover -s tests -p test_f3_provenance.py -v
