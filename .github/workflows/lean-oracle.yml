name: lean-oracle
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
      - run: lake exe oracle-selfcheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/lean_mutation_suite.py --check
      - run: lake exe export-f3 > /tmp/f3-tensor.json
      - run: python scripts/check_f3_table.py --lean-export /tmp/f3-tensor.json
      - run: python -m unittest discover -s tests -p test_f3_provenance.py -v
