name: lean-oracle
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
      - run: lake exe oracle-selfcheck
      - run: python3 scripts/lean_mutation_suite.py --check
